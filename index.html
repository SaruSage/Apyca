<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadeira A3 — Simulador Estrutural</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>Cadeira A3</h1>
    <p class="subtitulo">Simulador de dimensionamento estrutural</p>
  </header>

  <div id="erro-global"></div>

  <main class="layout">
    <section class="painel">
      <h2>Entradas</h2>
      <form id="form-cadeira" novalidate>
        <div class="campo">
          <label for="material">Material</label>
          <select id="material" name="material"></select>
        </div>
        <div class="campo">
          <label for="espessura">Espessura da perna (cm)</label>
          <input id="espessura" name="espessura" type="number" min="0.5" max="15" step="0.5" value="4">
        </div>
        <div class="campo">
          <label for="altura">Altura da perna (cm)</label>
          <input id="altura" name="altura" type="number" min="20" max="120" step="1" value="45">
        </div>
        <div class="campo">
          <label for="massa">Massa do usuário (kg)</label>
          <input id="massa" name="massa" type="number" min="10" max="250" step="1" value="90">
        </div>
        <div class="campo">
          <label for="forma">Formato da perna</label>
          <select id="forma" name="forma">
            <option value="quadrada">Quadrada</option>
            <option value="redonda">Redonda</option>
          </select>
        </div>
        <div class="campo">
          <label for="numPernas">Número de pernas</label>
          <select id="numPernas" name="numPernas">
            <option value="4">4 pernas</option>
            <option value="1">1 perna (pedestal)</option>
          </select>
        </div>
        <button type="submit" class="botao">Simular</button>
      </form>
    </section>

    <section class="painel">
      <h2>Vista isométrica</h2>
      <div id="palco" class="palco"></div>
    </section>

    <section class="painel">
      <h2>Resultados</h2>
      <div id="resultado" class="resultado"></div>
    </section>
  </main>

  <script>
  (function(){
    var box = document.getElementById('erro-global');
    function show(msg){
      box.style.display = 'block';
      box.textContent += msg + '\n';
    }
    window.addEventListener('error', function(e){
      show('ERRO: ' + (e.message || 'falha de carregamento') +
           (e.filename ? '\n  em ' + e.filename + ':' + e.lineno : ''));
    }, true);
    window.addEventListener('unhandledrejection', function(e){
      show('PROMISE: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
  })();
  </script>

  <script type="module" src="js/app.js"></script>
</body>
</html>
