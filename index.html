<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apyca — Simulador Estrutural</title>
  <link rel="stylesheet" href="css/style.css">
</head>


<body>

  <div id="erro-global"></div>

  <main class="layout">
    <section class="painel painel--entradas">
      <h2>Entradas</h2>
      <form id="form-cadeira" novalidate>
        <div class="campo">
          <label for="material">Material</label>
          <select id="material" name="material"></select>
        </div>

        <div class="campo">
          <label for="espessura">Dimensão externa da perna (cm)</label>
          <input id="espessura" name="espessura" type="number"
                 min="0.5" max="15" step="0.5" value="4">
        </div>

        <div class="campo">
          <label for="altura">Altura da perna (cm)</label>
          <input id="altura" name="altura" type="number"
                 min="20" max="120" step="1" value="45">
        </div>

        <div class="campo">
          <label for="massa">Massa do usuário (kg)</label>
          <input id="massa" name="massa" type="number"
                 min="10" max="250" step="1" value="90">
        </div>

        <div class="campo">
          <label for="forma">Formato da perna</label>
          <select id="forma" name="forma">
            <option value="quadrada" selected>Quadrada</option>
            <option value="redonda">Redonda</option>
          </select>
        </div>

        <div class="campo">
          <label for="secao">Seção</label>
          <select id="secao" name="secao">
            <option value="macica" selected>Maciça</option>
            <option value="tubular">Tubular (vazada)</option>
          </select>
        </div>

        <div class="campo" id="grupo-parede" hidden>
          <label for="parede">Parede do tubo (mm)</label>
          <input id="parede" name="parede" type="number"
                 min="0.5" max="75" step="0.5" value="3">
        </div>

        <div class="campo">
          <label for="encosto">Encosto</label>
          <select id="encosto" name="encosto">
            <option value="com" selected>Com encosto</option>
            <option value="sem">Sem encosto (banco)</option>
          </select>
        </div>

        <div class="campo">
          <label for="numPernas">Número de pernas</label>
          <select id="numPernas" name="numPernas">
            <option value="4" selected>4 pernas</option>
            <option value="1">1 perna (pedestal)</option>
          </select>
        </div>

        <!-- Travessas de apoio do assento. Só existem no quadro de quatro
             pernas: no pedestal central não há duas pernas para ligar.
             A classe campo-travessa é o que o app usa para mostrá-las e
             escondê-las junto com a troca do número de pernas. -->
        <div class="campo campo-travessa">
          <label for="travessa-largura">Largura da travessa (cm)</label>
          <input id="travessa-largura" name="travessa-largura" type="number"
                 min="1" max="15" step="0.5" value="4">
        </div>

        <div class="campo campo-travessa">
          <label for="travessa-altura">Altura da travessa (cm)</label>
          <input id="travessa-altura" name="travessa-altura" type="number"
                 min="2" max="20" step="0.5" value="6">
        </div>

      </form>

      <div class="acoes-entrada">
        <button type="submit" form="form-cadeira" class="botao botao--animar"
                id="botao-animar">Animar</button>
        <button type="button" class="menu-lateral__botao" id="menu-botao"
                aria-expanded="false" aria-controls="menu-painel"
                aria-label="Mais opções">
          <span class="menu-lateral__icone" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
        </button>
      </div>

      <div class="menu-lateral__painel" id="menu-painel" hidden>
        <button type="button" class="menu-lateral__item" id="item-graficos">
          <span>Ir para Gráficos</span>
          <span class="menu-lateral__dica">nova aba</span>
        </button>
      </div>
    </section>

    <section class="painel painel--vista">
      <div class="topo-vista">
        <h2>Vista isométrica</h2>
        <div class="identidade">
          <span class="identidade__nome">Apyca</span>
          <span class="identidade__subtitulo">Simulador de dimensionamento estrutural</span>
        </div>
      </div>

      <div id="palco" class="palco"></div>

      <p id="legenda" class="legenda"></p>

      <p id="situacao" class="situacao" hidden></p>
    </section>

    <section class="painel painel--resultados">
      <div class="painel__cabecalho">
        <h2>Resultados</h2>
        <button type="button" class="botao botao--secundario botao--mini"
                id="abrir-memorial">Documentação</button>
      </div>
      <div id="resultado" class="resultado"></div>
    </section>
  </main>

  <dialog id="memorial-dialog" class="memorial">
    <div class="memorial__barra">
      <strong>Memorial de cálculo</strong>
      <div class="memorial__acoes">
        <button type="button" class="botao botao--secundario"
                id="memorial-imprimir">Imprimir</button>
        <button type="button" class="botao botao--secundario"
                id="memorial-fechar">Fechar</button>
      </div>
    </div>
    <div class="memorial__conteudo" id="memorial-conteudo"></div>
  </dialog>

  <script>
    /* Banner de erro: mostra no alto da página a exceção que o console
       registraria, para o erro não passar despercebido na demonstração. */
    (function(){
      var alvo = document.getElementById('erro-global');
      if (!alvo) return;

      function show(msg){
        alvo.textContent = String(msg);
        alvo.style.display = 'block';
      }

      window.addEventListener('error', function(e){
        show('JS: ' + (e.message || '') +
             ' (' + (e.filename || '') +
             (e.lineno ? ':' + e.lineno : '') + ')');
      }, true);

      window.addEventListener('unhandledrejection', function(e){
        show('PROMISE: ' +
             (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
    })();
  </script>

  <script type="module" src="js/app.js"></script>

  <!-- Copia do memorial usada apenas na impressao.
       Fica fora do dialogo de proposito: elemento na top layer e recortado
       pela area de rolagem, o que cortava o inicio do documento no papel. -->
  <div id="memorial-print" class="memorial__conteudo" aria-hidden="true"></div>

</body>
</html>
