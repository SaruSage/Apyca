<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Testes — Motor de calculo</title>
  <style>
    body{background:#12161c;color:#e7edf5;font-family:ui-monospace,monospace;
      padding:32px;line-height:1.6}
    h1{font-size:1.2rem}
    .ok{color:#3ecf8e}
    .falha{color:#f2555a}
    .resumo{margin-top:24px;padding:12px 16px;border-radius:8px;font-weight:700}
  </style>
</head>
<body>
  <h1>Testes do motor de calculo</h1>
  <div id="saida"></div>
  <script type="module">
    import { calcular } from '../js/solver.js';

    const saida = document.getElementById('saida');
    let passou = 0, falhou = 0;

    function quase(real, esperado, tol = 1e-6){
      const escala = Math.max(1, Math.abs(esperado));
      return Math.abs(real - esperado) <= tol * escala;
    }

    function verificar(nome, condicao, detalhe = ''){
      const div = document.createElement('div');
      if (condicao) {
        passou++;
        div.className = 'ok';
        div.textContent = 'PASS  ' + nome;
      } else {
        falhou++;
        div.className = 'falha';
        div.textContent = 'FAIL  ' + nome + (detalhe ? ' — ' + detalhe : '');
      }
      saida.appendChild(div);
    }

    function testarCaso(nome, entrada, esperado){
      const r = calcular(entrada);
      if (!r.ok) {
        verificar(nome, false, 'calculo retornou erro: ' + r.erros.join(' '));
        return;
      }
      verificar(nome + ' · area', quase(r.secao.A, esperado.A), 'obtido ' + r.secao.A);
      verificar(nome + ' · reacao maxima', quase(r.forcas.Nmax, esperado.Nmax),
        'obtido ' + r.forcas.Nmax);
      verificar(nome + ' · momento', quase(r.forcas.Mperna, esperado.Mperna),
        'obtido ' + r.forcas.Mperna);
      verificar(nome + ' · tensao axial', quase(r.tensoes.sigmaAxial, esperado.sigmaAxial),
        'obtido ' + r.tensoes.sigmaAxial);
      verificar(nome + ' · flexao', quase(r.tensoes.sigmaFlexao, esperado.sigmaFlexao),
        'obtido ' + r.tensoes.sigmaFlexao);
      verificar(nome + ' · tensao maxima', quase(r.tensoes.sigmaMax, esperado.sigmaMax),
        'obtido ' + r.tensoes.sigmaMax);
      verificar(nome + ' · utilizacao', quase(r.tensoes.utilizacao, esperado.utilizacao),
        'obtido ' + r.tensoes.utilizacao);
      verificar(nome + ' · esbeltez', quase(r.flambagem.lambda, esperado.lambda),
        'obtido ' + r.flambagem.lambda);
      verificar(nome + ' · carga critica', quase(r.flambagem.Pcr, esperado.Pcr),
        'obtido ' + r.flambagem.Pcr);
      verificar(nome + ' · encurtamento', quase(r.deformacao.deltaAxial, esperado.deltaAxial),
        'obtido ' + r.deformacao.deltaAxial);
      verificar(nome + ' · aprovado', r.veredito.aprovado === esperado.aprovado);
    }

    /* ---------- Secao QUADRADA, 4 pernas (nao-regressao) ---------- */

    testarCaso('madeira quadrada 4p t=40 H=450 m=100',
      { materialId:'madeira', espessuraMm:40, alturaMm:450, massaKg:100 },
      {
        A:1600,
        Nmax:306.5625,
        Mperna:12262.5,
        sigmaAxial:0.1916015625,
        sigmaFlexao:1.149609375,
        sigmaMax:1.3412109375,
        utilizacao:1.3412109375 / 20,
        lambda:450 / (40 / Math.sqrt(12)),
        Pcr:(Math.PI**2 * 9500 * (40**4 / 12)) / (450**2),
        deltaAxial:(306.5625 * 450) / (1600 * 9500),
        aprovado:true
      });

    testarCaso('aco quadrada 4p t=20 H=450 m=120',
      { materialId:'aco', espessuraMm:20, alturaMm:450, massaKg:120 },
      {
        A:400,
        Nmax:367.875,
        Mperna:14715,
        sigmaAxial:0.9196875,
        sigmaFlexao:11.03625,
        sigmaMax:11.9559375,
        utilizacao:11.9559375 / (250 / 1.5),
        lambda:450 / (20 / Math.sqrt(12)),
        Pcr:(Math.PI**2 * 200000 * (20**4 / 12)) / (450**2),
        deltaAxial:(367.875 * 450) / (400 * 200000),
        aprovado:true
      });

    testarCaso('aluminio quadrada 4p t=30 H=500 m=150',
      { materialId:'aluminio', espessuraMm:30, alturaMm:500, massaKg:150 },
      {
        A:900,
        Nmax:459.84375,
        Mperna:18393.75,
        sigmaAxial:0.5109375,
        sigmaFlexao:4.0875,
        sigmaMax:4.5984375,
        utilizacao:4.5984375 / 160,
        lambda:500 / (30 / Math.sqrt(12)),
        Pcr:(Math.PI**2 * 69000 * (30**4 / 12)) / (500**2),
        deltaAxial:(459.84375 * 500) / (900 * 69000),
        aprovado:true
      });

    /* ---------- Secao REDONDA, 4 pernas ---------- */

    const Ared = Math.PI * 30 * 30 / 4;
    const Ired = Math.PI * Math.pow(30, 4) / 64;
    const Wred = Ired / 15;

    testarCaso('aluminio redonda 4p t=30 H=500 m=150',
      { materialId:'aluminio', espessuraMm:30, alturaMm:500, massaKg:150, forma:'redonda' },
      {
        A: Ared,
        Nmax: 459.84375,
        Mperna: 18393.75,
        sigmaAxial: 459.84375 / Ared,
        sigmaFlexao: 18393.75 / Wred,
        sigmaMax: (459.84375 / Ared) + (18393.75 / Wred),
        utilizacao: ((459.84375 / Ared) + (18393.75 / Wred)) / 160,
        lambda: 500 / (30 / 4),
        Pcr: (Math.PI**2 * 69000 * Ired) / (500**2),
        deltaAxial: (459.84375 * 500) / (Ared * 69000),
        aprovado: true
      });

    /* ---------- PEDESTAL: piramide (quadrada) e cone (redonda) ---------- */

    const Wq40 = Math.pow(40, 3) / 6;
    const Kbal = 2;

    testarCaso('madeira quadrada 1p t=40 H=450 m=100',
      { materialId:'madeira', espessuraMm:40, alturaMm:450, massaKg:100, numPernas:1 },
      {
        A: 1600,
        Nmax: 981,
        Mperna: 49050,
        sigmaAxial: 981 / 1600,
        sigmaFlexao: 49050 / Wq40,
        sigmaMax: (981 / 1600) + (49050 / Wq40),
        utilizacao: ((981 / 1600) + (49050 / Wq40)) / 20,
        lambda: (Kbal * 450) / (40 / Math.sqrt(12)),
        Pcr: (Math.PI**2 * 9500 * (Math.pow(40, 4) / 12)) / (Kbal * 450) ** 2,
        deltaAxial: (981 * 450) / (1600 * 9500),
        aprovado: true
      });

    const ped = calcular({ materialId:'madeira', espessuraMm:40,
                           alturaMm:450, massaKg:100, numPernas:1 });
    const pedRed = calcular({ materialId:'madeira', espessuraMm:40,
                              alturaMm:450, massaKg:100, numPernas:1, forma:'redonda' });
    const quatro = calcular({ materialId:'madeira', espessuraMm:40,
                              alturaMm:450, massaKg:100, numPernas:4 });

    /* ---------- Assento em balanco ---------- */

    const bAss = 440;
    const hAss = 20;          // 0,5 * 40
    const aPed = 200;         // 200 + 20 - 20
    const MoRef = 981 * aPed;
    const WoRef = (bAss * hAss * hAss) / 6;
    const IoRef = (bAss * Math.pow(hAss, 3)) / 12;
    const flechaRef = (981 * Math.pow(aPed, 3)) / (3 * 9500 * IoRef);

    verificar('assento: largura e espessura corretas',
      ped.ok && quase(ped.assento.b, 440) && quase(ped.assento.h, 20));
    verificar('assento do pedestal: balanco de 200 mm',
      ped.ok && quase(ped.assento.a, aPed), 'obtido ' + (ped.ok ? ped.assento.a : '-'));
    verificar('assento do pedestal: momento no engaste',
      ped.ok && quase(ped.assento.M, MoRef));
    verificar('assento do pedestal: modulo resistente',
      ped.ok && quase(ped.assento.W, WoRef));
    verificar('assento do pedestal: tensao de flexao',
      ped.ok && quase(ped.assento.sigma, MoRef / WoRef));
    verificar('assento do pedestal: flecha',
      ped.ok && quase(ped.assento.flecha, flechaRef),
      'obtido ' + (ped.ok ? ped.assento.flecha : '-'));
    verificar('assento do pedestal: flecha limite = a/150',
      ped.ok && quase(ped.assento.flechaLimite, aPed / 150));
    verificar('assento do pedestal aprova em tensao e flecha',
      ped.ok && ped.assento.utilizacao <= 1 && ped.assento.utilizacaoFlecha <= 1);
    verificar('assento do pedestal nao governa a reprovacao',
      ped.ok && ped.veredito.aprovado === true);

    verificar('assento de 4 pernas tem balanco de 20 mm',
      quatro.ok && quase(quatro.assento.a, 20));
    verificar('assento de 4 pernas e muito menos solicitado',
      quatro.ok && ped.ok && ped.assento.sigma > 5 * quatro.assento.sigma);
    verificar('assento de 4 pernas tem flecha desprezivel',
      quatro.ok && quatro.assento.flecha < 0.01);

    const pedFino = calcular({ materialId:'madeira', espessuraMm:10,
                               alturaMm:450, massaKg:90, numPernas:1 });
    verificar('assento fino reprova por tensao',
      pedFino.ok && pedFino.assento.utilizacao > 1,
      'util ' + (pedFino.ok ? pedFino.assento.utilizacao : '-'));
    verificar('assento fino reprova por flecha',
      pedFino.ok && pedFino.assento.utilizacaoFlecha > 1);
    verificar('assento fino aparece nos motivos',
      pedFino.ok && pedFino.veredito.motivos.some(t => t.indexOf('assento') >= 0));

    const pedGrosso = calcular({ materialId:'aco', espessuraMm:60,
                                 alturaMm:450, massaKg:100, numPernas:1 });
    verificar('assento robusto aprova',
      pedGrosso.ok && pedGrosso.assento.utilizacao <= 1 &&
      pedGrosso.assento.utilizacaoFlecha <= 1);

    /* ---------- Tombamento e regime ---------- */

    verificar('pedestal usa K = 2 (balanco)', ped.ok && ped.flambagem.K === 2);
    verificar('4 pernas usa K = 1 (rotula-rotula)', quatro.ok && quatro.flambagem.K === 1);
    verificar('carga critica do pedestal e 1/4 da de 4 pernas',
      ped.ok && quase(ped.flambagem.Pcr, quatro.flambagem.Pcr / 4));
    verificar('4 pernas nao tem verificacao de tombamento',
      quatro.ok && quatro.estabilidade === null);
    verificar('braco do cone e o raio cheio',
      pedRed.ok && quase(pedRed.estabilidade.braco, 200));
    verificar('braco da piramide e metade do lado 2/3',
      ped.ok && quase(ped.estabilidade.braco, 200 * (2/3) / 1),
      'obtido ' + (ped.ok ? ped.estabilidade.braco : '-'));
    verificar('piramide tomba mais que o cone',
      ped.ok && pedRed.ok &&
      ped.estabilidade.utilizacao > pedRed.estabilidade.utilizacao);

        /* ---------- Assento entre apoios (4 pernas) ---------- */

    const asv = quatro.assentoVao;
    const bAssv = 440;
    const Lv = 400;
    const hv = 20;
    const qv = (100 * 9.81) / (bAssv * bAssv);
    const Mv = (qv * Lv * Lv) / 16;
    const flechav = (5 * qv * Math.pow(Lv, 4)) / (64 * 9500 * Math.pow(hv, 3));

    verificar('4 pernas tem verificacao do vao', quatro.ok && asv !== null);
    verificar('pedestal nao tem verificacao do vao', ped.ok && ped.assentoVao === null);
    verificar('vao e igual ao lado do quadro', quatro.ok && quase(asv.L, 400));
    verificar('pressao uniforme confere',
      quatro.ok && quase(asv.q, qv), 'obtido ' + (quatro.ok ? asv.q : '-'));
    verificar('momento no vao confere',
      quatro.ok && quase(asv.M, Mv));
    verificar('tensao no vao confere',
      quatro.ok && quase(asv.sigma, (6 * Mv) / (hv * hv)));
    verificar('flecha no vao confere',
      quatro.ok && quase(asv.flecha, flechav),
      'obtido ' + (quatro.ok ? asv.flecha : '-'));
    verificar('flecha limite do vao = L/300',
      quatro.ok && quase(asv.flechaLimite, 400 / 300));
    verificar('madeira de 4 cm aprova no vao',
      quatro.ok && asv.utilizacao < 1 && asv.utilizacaoFlecha < 1);

    // Metodo das faixas e conservador frente a solucao de placa (0,0479)
    verificar('coeficiente 1/16 maior que 0,0479',
      quase((qv * Lv * Lv) / 16, 0.0625 * qv * Lv * Lv, 1e-9) &&
      (0.0625 > 0.0479));

    const quatroFino = calcular({ materialId:'madeira', espessuraMm:10,
                                  alturaMm:450, massaKg:100 });
    verificar('4 pernas finas reprovam no vao por flecha',
      quatroFino.ok && quatroFino.assentoVao.utilizacaoFlecha > 1,
      'util ' + (quatroFino.ok ? quatroFino.assentoVao.utilizacaoFlecha : '-'));
    verificar('4 pernas finas aparecem nos motivos',
      quatroFino.ok &&
      quatroFino.veredito.motivos.some(t => t.indexOf('entre os apoios') >= 0));

    const acoVao = calcular({ materialId:'aco', espessuraMm:20,
                              alturaMm:450, massaKg:120 });
    verificar('aco de 2 cm aprova com folga no vao',
      acoVao.ok && acoVao.assentoVao.utilizacao < 0.1 &&
      acoVao.assentoVao.utilizacaoFlecha < 0.1);

          /* ---------- Desenho técnico ---------- */

    const barrasQuatro = construirBarras(
      quatro.entrada.t, quatro.entrada.H, quatro.entrada.material,
      quatro.entrada.forma, quatro.entrada.numPernas,
      quatro.entrada.vazada, quatro.entrada.parede,
      quatro.entrada.comEncosto
    );

    const prancha = desenhoTecnico(barrasQuatro);

    verificar('desenho tecnico gera svg', prancha.indexOf('<svg') === 0);
    verificar('prancha tem as quatro vistas',
      prancha.indexOf('VISTA FRONTAL') > 0 &&
      prancha.indexOf('VISTA LATERAL') > 0 &&
      prancha.indexOf('VISTA SUPERIOR') > 0 &&
      prancha.indexOf('VISTA INFERIOR') > 0);
    verificar('prancha cota a altura total em cm',
      prancha.indexOf('>79<') > 0, 'altura 790 mm deveria virar 79 cm');
    verificar('prancha cota a largura em cm',
      prancha.indexOf('>44<') > 0, 'largura 440 mm deveria virar 44 cm');
    verificar('prancha tem poligonos de contorno preto',
      prancha.indexOf('stroke="#000"') > 0 && prancha.indexOf('fill="#fff"') > 0);

    const bancores = calcular({ materialId:'madeira', espessuraMm:40,
                                alturaMm:450, massaKg:100, comEncosto:false });
    const pranchaBanco = desenhoTecnico(construirBarras(
      bancores.entrada.t, bancores.entrada.H, bancores.entrada.material,
      bancores.entrada.forma, bancores.entrada.numPernas,
      bancores.entrada.vazada, bancores.entrada.parede,
      bancores.entrada.comEncosto
    ));
    verificar('banco tem prancha mais baixa que a cadeira',
      bancores.ok && prancha.length > 0 && pranchaBanco.length > 0 &&
      pranchaBanco.length !== prancha.length);
    verificar('prancha vazia nao quebra',
      desenhoTecnico([]) === '' && desenhoTecnico(null) === '');

          /* ---------- Cotas de detalhe no desenho técnico ---------- */

    verificar('prancha cota a espessura da perna',
      />4<\/text>/.test(prancha), 'esperado cota de 4 cm');

    const barrasPed = construirBarras(
      ped.entrada.t, ped.entrada.H, ped.entrada.material,
      ped.entrada.forma, ped.entrada.numPernas,
      ped.entrada.vazada, ped.entrada.parede,
      ped.entrada.comEncosto
    );
    const pranchaPed = desenhoTecnico(barrasPed);

    const basePeCm = (2 * CADEIRA.coneRaioBase * CADEIRA.fracaoLadoPiramide / 10)
      .toLocaleString('pt-BR', { maximumFractionDigits: 1 });

    verificar('prancha do pedestal cota a base do pe',
      pranchaPed.indexOf('>' + basePeCm + '</text>') > 0,
      'esperado ' + basePeCm + ' cm');

    verificar('pedestal recebe mais cotas que a cadeira de 4 pernas',
      pranchaPed.split('<text').length > prancha.split('<text').length,
      'pedestal ' + pranchaPed.split('<text').length +
      ' vs ' + prancha.split('<text').length);

    verificar('nenhuma cota ficou fora do viewBox',
      prancha.indexOf('x1="-') < 0 && prancha.indexOf('y1="-') < 0);

      
    /* ---------- Contorno ---------- */

    const ruim = calcular({ materialId:'madeira', espessuraMm:10,
                            alturaMm:900, massaKg:200 });
    verificar('caso reprovado tem motivo', ruim.ok && !ruim.veredito.aprovado);

    const inv = calcular({ materialId:'madeira', espessuraMm:0,
                           alturaMm:450, massaKg:90 });
    verificar('espessura zero retorna erro', inv.ok === false);

    const semMat = calcular({ materialId:'titanio', espessuraMm:30,
                              alturaMm:450, massaKg:90 });
    verificar('material desconhecido retorna erro', semMat.ok === false);

    const resumo = document.createElement('div');
    resumo.className = 'resumo';
    resumo.textContent = falhou === 0
      ? 'Todos os ' + passou + ' testes passaram.'
      : passou + ' passaram, ' + falhou + ' falharam.';
    resumo.style.background = falhou === 0
      ? 'rgba(62,207,142,.14)' : 'rgba(242,85,90,.14)';
    resumo.style.color = falhou === 0 ? '#3ecf8e' : '#f2555a';
    document.body.appendChild(resumo);
  </script>
</body>
</html>
